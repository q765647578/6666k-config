;---------------------------------------------------------------------
; 3、分流规则：MetaCubeX meta-rules-dat（每日自动更新）
;    以 rule-providers 形式下发，客户端自己每 24 小时更新，不用重新转换订阅
;---------------------------------------------------------------------
ruleset=DIRECT,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml,86400
ruleset=REJECT,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.yaml,86400
ruleset=🚀 节点选择,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.yaml,86400
ruleset=DIRECT,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml,86400
ruleset=DIRECT,[]GEOIP,LAN
ruleset=DIRECT,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

;---------------------------------------------------------------------
; 4、策略组
;---------------------------------------------------------------------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]DIRECT
custom_proxy_group=📢 QQ:938203009`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
